# React static files + reverse proxy to the API. Listens on 8080 inside the container.

# Slow down password guessing (the API also throttles per client and username).
limit_req_zone $binary_remote_addr zone=rma_login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # The SPA only talks to its own origin; nothing is embedded or loaded from elsewhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=rma_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/rma-proxy.conf;
        proxy_pass http://api:8765;
    }

    location /api/ {
        include /etc/nginx/rma-proxy.conf;
        proxy_pass http://api:8765;
    }

    # Hashed build assets never change: cache them hard.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes fall back to the app shell; the shell itself is never cached.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
