; Runs as the non-root container user. All runtime files live in /tmp/rma-poc.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/rma-poc/supervisord.pid
childlogdir=/tmp/rma-poc
loglevel=info

[unix_http_server]
file=/tmp/rma-poc/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/rma-poc/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_POC_SCREEN)s -nolisten tcp
priority=10
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:openbox]
command=/opt/rma-poc/bin/wait-for-x.sh /usr/bin/openbox
environment=DISPLAY=":99"
priority=20
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; VNC listens on loopback only; the sole published entry point is noVNC (6080).
[program:x11vnc]
command=/opt/rma-poc/bin/wait-for-x.sh /usr/bin/x11vnc -display :99 -localhost -rfbport 5900 -passwdfile /tmp/rma-poc/vncpass -forever -shared
priority=30
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=40
autorestart=true
startsecs=2
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
