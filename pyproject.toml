[project]
name = "rma-portal"
version = "0.1.0"
description = "Internal RMA monitoring portal reading OmegaFlow (read-only) for the agency LAN."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "camoufox[geoip]>=0.4.11",
    "playwright>=1.48",
    "tzdata>=2024.2",
    "itsdangerous>=2.2",
    "filelock>=3.16",
    "beautifulsoup4>=4.12",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
rma-portal = "rma_portal.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rma_portal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["rma_portal"]
